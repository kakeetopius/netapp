[workspace]
resolver = "2"
members = ["netapp", "netapp-common", "netapp-ebpf"]
default-members = ["netapp", "netapp-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }
anyhow = { version = "1", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
env_logger = { version = "0.11", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
tokio = { version = "1.40", default-features = false }
which = { version = "6.0", default-features = false }

[profile.release.package.netapp-ebpf]
debug = 2
codegen-units = 1
strip = false
