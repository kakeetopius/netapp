[package]
name = "netapp-ebpf"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
netapp-common = { path = "../netapp-common" }
aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }

[[bin]]
name = "netapp"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
