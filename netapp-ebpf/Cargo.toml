[package]
name = "netapp-ebpf"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
netapp-common = { path = "../netapp-common" }
aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }

[[bin]]
name = "netapp"
path = "src/main.rs"

# Cargo ignores [profile.*] tables in non-root workspace members; the actual
# release settings for this crate live in the root Cargo.toml's
# [profile.release.package.netapp-ebpf].
