[env]
# The bpfel-unknown-none target has no prebuilt std, so building the eBPF
# crate needs `-Z build-std=core`, which normally requires nightly. This
# machine has the pacman `rust-src` package installed at the exact path
# `-Z build-std` expects, so scoping RUSTC_BOOTSTRAP to just the eBPF crate
# name unlocks the unstable flag on stable rustc without installing nightly.
RUSTC_BOOTSTRAP = { value = "netapp-ebpf", force = false }

[target."cfg(all())"]
# eBPF loading (kprobes/XDP/TC) needs root; this machine has no passwordless
# sudo, so `cargo run` prompts interactively via sudo. Cargo's `runner` has
# no way to distinguish `cargo run` from `cargo test`/`cargo bench` for the
# same target, so this inline script does that itself: only a binary whose
# path ends in exactly "/netapp" -- the plain `[[bin]]` output from `cargo
# build`/`cargo run` -- gets sudo'd. Test/bench binaries always get a
# "-<hash>" suffix appended to that same name by cargo, so they fall
# through untouched and need no root access.
#
# (A separate runner.sh file doesn't work here: cargo runs the runner with
# cwd set to the manifest dir of whichever workspace member is being
# built, not the workspace root, so a workspace-root-relative script path
# doesn't resolve for every member. Matching on a `deps/` output dir also
# doesn't work: depending on cargo version, `cargo test`'s binary can land
# directly under `target/.../build/netapp/<hash>/out/` instead.)
runner = [
    "sh", "-c",
    'case "$1" in */netapp) exec sudo -E "$@" ;; *) exec "$@" ;; esac',
    "sh",
]

[unstable]
# bpfel-unknown-none is a freestanding target with no libc, so LLVM's
# memset/memcpy/memmove intrinsic lowering has nothing to call into --
# bpf-linker reports this as "call to built-in function 'memset' is not
# supported". compiler_builtins ships Rust implementations of these, but
# they're off by default; this turns them on for the eBPF crate's build-std.
build-std-features = ["compiler-builtins-mem"]
